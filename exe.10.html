<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHOPOLY - Anti Collision Layout</title>

    <style>
        /* ==========================================================================
           1. CORE LAYOUT SYSTEM (STRICT GRID ANTI-TABRAKAN)
           ========================================================================== */
        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(circle, #1e272e 0%, #0f141c 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            box-sizing: border-box;
            height: 100vh;
            overflow: hidden; /* Mengunci scrollbar utama browser */
            
            /* Pembagian 3 baris mutlak agar komponen tidak saling tindih */
            display: grid;
            grid-template-rows: auto 1fr auto; 
            gap: 10px;
        }

        /* Pembungkus Komponen Kontrol Atas */
        .game-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        h1.main-title {
            margin: 0;
            font-size: clamp(20px, 2.8vh, 30px);
            color: #00d2d3;
            text-shadow: 0 0 10px rgba(0, 210, 211, 0.5);
        }

        .top-control {
            margin: 2px 0;
        }

        input {
            padding: 6px;
            width: 110px;
            border: 2px solid #34495e;
            background: #2c3e50;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        button {
            padding: 6px 16px;
            border: none;
            background: #10ac84;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 3px 0 #0b8463;
        }

        button:hover { background: #1dd1a1; }
        button:active { transform: translateY(3px); box-shadow: none; }
        button:disabled { background: #57606f; box-shadow: none; cursor: not-allowed; }

        .turn-box {
            font-size: clamp(14px, 2vh, 20px);
            font-weight: bold;
            color: #ff9f43;
        }

        .queue-box {
            font-size: clamp(11px, 1.6vh, 16px);
        }

        /* ==========================================================================
           2. MIDDLE ARENA: GRID AREA UTAMA PERMAINAN
           ========================================================================== */
        .game-container {
            display: grid;
            grid-template-columns: 260px 1fr 260px; /* Lebar UI Box Player Kiri & Kanan */
            gap: 15px;
            align-items: center;
            justify-content: center;
            min-height: 0; /* Mencegah elemen meluber keluar grid */
            height: 100%;
        }

        .sidebar-left, .sidebar-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 60vh; /* Disamakan dengan tinggi maksimal papan */
        }

        /* ==========================================================================
           3. SIDEBAR PLAYER BOX UI
           ========================================================================== */
        .player-info {
            background: #2c3e50;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            font-size: clamp(12px, 1.6vh, 17px); 
            height: 48%; /* Membagi ruang atas bawah seimbang di sidebar */
            overflow-y: auto;
            box-sizing: border-box;
            line-height: 1.35;
        }

        .player-info h3 {
            font-size: clamp(14px, 2.1vh, 22px);
            margin: 0 0 6px 0;
            border-bottom: 2px solid #485e74;
            padding-bottom: 3px;
        }

        /* ==========================================================================
           4. PAPAN MONOPOLI (RESPONSIF & AMAN DI ZOOM 100%)
           ========================================================================== */
        .board-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .board {
            height: 62vh; /* Dioptimalkan dari 76vh ke 60vh agar pas di zoom 100% monitor manapun */
            width: 78vh;  /* Tetap kotak sempurna 1:1 */
            background: #222f3e;
            border: 6px solid #00d2d3;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 210, 211, 0.4);
            box-sizing: border-box;
        }

        /* Teks Tile Dinamis Otomatis Membesar saat Zoom Out */
        .tile {
            position: absolute;
            border: 1px solid #10ac84;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: 850; 
            padding: 4px;
            color: #ffffff;
            font-size: clamp(9px, 1.1vh, 14px); 
            line-height: 1.15;
            word-break: break-word;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .corner { 
            width: 15.5%; 
            height: 15.5%; 
            background: #341f97; 
            color: #ffffff; 
            border: 2px solid #5f27cd; 
            z-index: 10; 
            font-size: clamp(13px, 1.7vh, 24px); 
        }
        
        .horizontal { width: 9.85%; height: 15.5%; }
        .vertical { width: 15.5%; height: 9.85%; }

        /* Tipe Warna Kamar Tile */
        .property { background: #2e86de; border-top: 4px solid #2471ba; }
        .chance { background: #833471; }
        .community { background: #e15f41; }
        .safe { background: #576574; }
        .jail { background: #ee5253; }

        /* Area Dalam Tengah Papan */
        .center-area {
            position: absolute;
            width: 69%;
            height: 69%;
            left: 15.5%;
            top: 15.5%;
            background: #1e272e;
            border: 4px dashed #00d2d3;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-sizing: border-box;
            padding: 10px;
        }

        .center-area h1 { font-size: clamp(22px, 4vh, 45px); margin: 0; color: #00d2d3; text-shadow: 0 0 8px rgba(0,210,211,0.4); }
        .center-area p { font-size: clamp(12px, 1.8vh, 18px); color: #84817a; margin: 3px 0; }

        .dice-visual {
            font-size: clamp(26px, 4vh, 40px);
            margin-top: 8px;
            background: #2c3e50;
            padding: 4px 18px;
            border: 3px solid #00d2d3;
            border-radius: 10px;
            color: white;
        }

        /* Token Pemain */
        .player {
            width: clamp(16px, 2vh, 24px);
            height: clamp(16px, 2vh, 24px);
            border-radius: 50%;
            position: absolute;
            z-index: 99;
            transition: all .3s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: clamp(9px, 1.2vh, 13px);
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 0 6px rgba(255,255,255,0.9);
        }

        /* ==========================================================================
           5. LOG BOX (DIKUNCI DI BARIS TERBAWAH GRID - ANTI TABRAKAN)
           ========================================================================== */
        .log {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #2c3e50;
            border: 2px solid #34495e;
            border-radius: 8px;
            padding: 8px;
            height: 75px; /* Tinggi permanen aman */
            overflow-y: auto;
            color: #c8d6e5;
            font-size: 13px;
            box-sizing: border-box;
        }

        .property-list { margin-top: 4px; padding-left: 15px; font-size: clamp(11px, 1.4vh, 14px); color: #ffdd59; }
        .audio-control { margin-top: 4px; font-size: clamp(11px, 1.5vh, 15px); color: #ff9f43; cursor: pointer; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

        <div class="top-control">

function toggleBGM() {
    if (bgm.paused) {
        bgm.play().catch(e => alert("Klik sembarang tempat pada halaman web terlebih dahulu!"));
        addLog("🎵 Backsound diaktifkan.");
    } else {
        bgm.pause();
        addLog("🎵 Backsound dimatikan.");
    }
}

/* ==========================================================================
   INITIALIZATION MAP TILES MAP MONOPOLI
   ========================================================================== */
function createTiles(){
    tiles.length = 0;
    const names = [
        "START", "JKT Digital City", "Dana Umum", "BDG Startup Hub", "Safe Zone", "Kesempatan", "Tokyo Tech", "Cloud District",
        "Cyber Jail", "AI Inov Lab", "Dana Umum", "SG Data Center", "Safe Zone", "Kesempatan", "Queue Bank", "Sort Factory",
        "Crypto Faucet", "Stack House", "Dana Umum", "Prog Campus", "Safe Zone", "Kesempatan", "DB Central", "Bug Hunter",
        "Go To Jail", "Mining Lab", "Dana Umum", "Sec Server", "Safe Zone", "Kesempatan", "Algo Center", "Net Tower"
    ];

    let path = [];
    
    // Sudut Kanan Bawah (START)
    path.push({x:84.5, y:84.5, type:"corner"});
    
    // Baris Bawah (Kanan ke Kiri)
    for(let i=0; i<7; i++) { 
        path.push({x: 74.65 - (i*9.85), y:84.5, type:"horizontal"}); 
    }
    
    // Sudut Kiri Bawah (Cyber Jail)
    path.push({x:0, y:84.5, type:"corner"});
    
    // Baris Kiri (Bawah ke Atas)
    for(let i=0; i<7; i++) { 
        path.push({x:0, y: 74.65 - (i*9.85), type:"vertical"}); 
    }
    
    // Sudut Kiri Atas (Crypto Faucet)
    path.push({x:0, y:0, type:"corner"});
    
    // Baris Atas (Kiri ke Kanan)
    for(let i=0; i<7; i++) { 
        path.push({x: 15.5 + (i*9.85), y:0, type:"horizontal"}); 
    }
    
    // Sudut Kanan Atas (Go To Jail)
    path.push({x:84.5, y:0, type:"corner"});
    
    // Baris Kanan (Atas ke Bawah)
    for(let i=0; i<7; i++) { 
        path.push({x:84.5, y: 15.5 + (i*9.85), type:"vertical"}); 
    }

    for(let i=0; i<32; i++){
        let type = "property";
        if(names[i].includes("Dana")) { type = "community"; }
        if(names[i].includes("Kesempatan")) { type = "chance"; }
        if(names[i].includes("Safe")) { type = "safe"; }
        if(names[i].includes("Jail")) { type = "jail"; }
        if(names[i] === "START") { type = "start"; }
        if(names[i] === "Crypto Faucet") { type = "safe"; }
        if(names[i] === "Go To Jail") { type = "jail"; }

        tiles.push({
            name: names[i],
            type: type,
            price: 100 + (i*5),
            rent: 20 + (i*2),
            owner: null,
            x: path[i].x, 
            y: path[i].y, 
            pType: path[i].type
        });
    }
}
createTiles();

function createBoard(){
    document.querySelectorAll(".tile").forEach(e => e.remove());
    tiles.forEach(tile=>{
        let div = document.createElement("div");
        div.classList.add("tile");
        
        if(tile.pType === "corner") { div.classList.add("corner"); }
        else if(tile.pType === "horizontal") { div.classList.add("horizontal"); }
        else { div.classList.add("vertical"); }

        if(tile.type === "property") { div.classList.add("property"); }
        if(tile.type === "chance") { div.classList.add("chance"); }
        if(tile.type === "community") { div.classList.add("community"); }
        if(tile.type === "safe") { div.classList.add("safe"); }
        if(tile.type === "jail") { div.classList.add("jail"); }

        div.style.left = tile.x + "%";
        div.style.top = tile.y + "%";
        div.innerHTML = tile.name;
        board.appendChild(div);
    });
}
createBoard();

/* ==========================================================================
   LOGIK GAME MECHANICS & ENGINE RUNNER
   ========================================================================== */
function startGame(){
    let count = parseInt(document.getElementById("playerCount").value);
    if(isNaN(count) || count < 2 || count > 4){ 
        alert("Jumlah Player valid berkisar antara 2 sampai 4 orang!"); 
        return; 
    }
    
    bgm.play().catch(e => console.log("Audio siap"));
    
    players = []; 
    turnQueue = []; 
    freeParkingPool = 0;
    
    updateUI(); 
    diceVisual.innerHTML = "🎲";
    document.querySelectorAll(".player").forEach(e => e.remove());

    for(let i=0; i<count; i++){
        let player = document.createElement("div");
        player.classList.add("player");
        player.style.background = colors[i];
        player.innerHTML = i+1;
        board.appendChild(player);

        players.push({ 
            name: "P" + (i+1), 
            money: 500, 
            position: 0, 
            properties: [], 
            element: player, 
            jailTurns: 0 
        });
        turnQueue.push(i);
    }
    
    gameStarted = true; 
    isMoving = false; 
    btnRoll.disabled = false;
    
    updateAllPlayerPositions(); 
    updateUI();
    addLog("🎮 Game dimulai! Struktur tata letak diproteksi anti-tabrakan.");
}

function rollDice(){
    if(!gameStarted || isMoving) return;
    
    let currentPlayer = turnQueue[0];
    if(players[currentPlayer].jailTurns > 0) {
        players[currentPlayer].jailTurns--;
        addLog(`🔒 ${players[currentPlayer].name} Terjebak di Cyber Jail! Turn ini hangus.`);
        sfxWrong.play(); 
        nextTurn(); 
        return;
    }
    
    isMoving = true; 
    btnRoll.disabled = true;
    sfxDice.currentTime = 0; 
    sfxDice.play().catch(e => console.log(e));
    
    let counter = 0;
    let rollInterval = setInterval(() => {
        diceVisual.innerHTML = diceFaces[Math.floor(Math.random() * 6) + 1];
        counter++;
        
        if(counter > 6) {
            clearInterval(rollInterval);
            let dice = Math.floor(Math.random() * 6) + 1;
            diceVisual.innerHTML = diceFaces[dice] + " (" + dice + ")";
            addLog("🎲 " + players[currentPlayer].name + " mendapatkan dadu " + dice);
            movePlayer(currentPlayer, dice);
        }
    }, 100);
}

function movePlayer(playerIndex, steps){
    let count = 0;
    let interval = setInterval(() => {
        players[playerIndex].position++;
        sfxStep.currentTime = 0; 
        sfxStep.play().catch(e => console.log(e));
        
        if(players[playerIndex].position >= tiles.length){
            players[playerIndex].position = 0; 
            players[playerIndex].money += 150;
            addLog("💰 " + players[playerIndex].name + " melewati ubin START (+150)");
        }
        
        updateAllPlayerPositions(); 
        count++;
        
        if(count >= steps){ 
            clearInterval(interval); 
            setTimeout(() => { processTile(playerIndex); }, 200); 
        }
    }, 400);
}

function processTile(playerIndex){
    let tile = tiles[players[playerIndex].position];
    
    if(players[playerIndex].position === GO_TO_JAIL_INDEX) {
        sfxWrong.play(); 
        alert(`🚨 ${players[playerIndex].name} melakukan Illegal Access! Masuk Cyber Jail.`);
        players[playerIndex].position = CYBER_JAIL_INDEX; 
        players[playerIndex].jailTurns = 1;
        updateAllPlayerPositions(); 
        nextTurn(); 
        return;
    }
    
    if(players[playerIndex].position === FREE_PARKING_INDEX) {
        if(freeParkingPool > 0) {
            sfxCorrect.play(); 
            alert(`🎁 Crypto Faucet Meledak! Anda mendapatkan gratis +💰${freeParkingPool}`);
            players[playerIndex].money += freeParkingPool; 
            freeParkingPool = 0;
        }
    }
    
    if(tile.type === "property"){
        if(tile.owner === null){
            if(confirm(`Beli aset ${tile.name} seharga (💰${tile.price})?`)){
                if(players[playerIndex].money >= tile.price){
                    players[playerIndex].money -= tile.price; 
                    tile.owner = playerIndex;
                    players[playerIndex].properties.push(tile.name);
                } else { 
                    sfxWrong.play(); 
                    alert("Modal bisnis kamu tidak cukup!"); 
                }
            }
        } else if(tile.owner !== playerIndex){
            sfxWrong.play(); 
            players[playerIndex].money -= tile.rent; 
            players[tile.owner].money += tile.rent;
            addLog(`💸 ${players[playerIndex].name} Bayar Sewa ke ${players[tile.owner].name}`);
        }
        
        showChallenge(playerIndex); 
        return;
    }
    
    if(tile.type === "chance"){
        let card = chanceCards[Math.floor(Math.random() * chanceCards.length)]; 
        alert(card);
        if(card.includes("+100")) { players[playerIndex].money += 100; }
        if(card.includes("-70"))  { players[playerIndex].money -= 70; freeParkingPool += 70; }
        if(card.includes("+120")) { players[playerIndex].money += 120; }
        if(card.includes("Maju 3")) { 
            players[playerIndex].position += 3; 
            updateAllPlayerPositions(); 
        }
    }
    
    if(tile.type === "community"){
        let card = communityCards[Math.floor(Math.random() * communityCards.length)]; 
        alert(card);
        if(card.includes("+80"))  { players[playerIndex].money += 80; }
        if(card.includes("+90"))  { players[playerIndex].money += 90; }
        if(card.includes("+100")) { players[playerIndex].money += 100; }
        if(card.includes("-60"))  { players[playerIndex].money -= 60; freeParkingPool += 60; }
    }
    
    nextTurn();
}

function showChallenge(playerIndex){
    let challenge = storyChallenges[Math.floor(Math.random() * storyChallenges.length)];
    let choose = confirm(`⚡ TANTANGAN STRUKTUR DATA!\n\nJawab kuis untuk mendapatkan modal gratis atau Cancel jika ingin lewat & denda 💰${challenge.penalty}`);
    
    if(choose){
        let ans = prompt(challenge.question + "\n\nKetik Jawaban Anda (A, B, atau C):");
        if(ans && ans.toUpperCase().trim() === challenge.answer){
            sfxCorrect.play(); 
            alert("✅ JAWABAN BENAR!\n\n" + challenge.explanation); 
            players[playerIndex].money += challenge.reward;
            addLog("✅ " + players[playerIndex].name + " menjawab BENAR (+ " + challenge.reward + ")");
        } else {
            sfxWrong.play(); 
            alert(`❌ JAWABAN SALAH!\n\nKunci jawaban yang benar adalah ${challenge.answer}.\n${challenge.explanation}\nDenda dipotong menuju Crypto Faucet Pool.`);
            players[playerIndex].money -= challenge.penalty; 
            freeParkingPool += challenge.penalty;
            addLog("❌ " + players[playerIndex].name + " menjawab SALAH (-" + challenge.penalty + ")");
        }
    } else { 
        players[playerIndex].money -= challenge.penalty; 
        freeParkingPool += challenge.penalty; 
        addLog("💸 " + players[playerIndex].name + " skip tantangan, denda ditampung Crypto Faucet.");
    }
    
    nextTurn();
}

/* ==========================================================================
   GRAPHICAL RENDER UPDATER & REFRESH HANDLER
   ========================================================================== */
function updateAllPlayerPositions(){
    tiles.forEach((tile, tileIndex) => {
        let playersInTile = [];
        players.forEach((p, idx) => { 
            if(p.position === tileIndex) { playersInTile.push({p:p, idx:idx}); }
        });

        playersInTile.forEach((data, order) => {
            let baseOffsetX = 2; 
            let baseOffsetY = 2;
            if(order === 1) { baseOffsetX = 8; }
            if(order === 2) { baseOffsetY = 8; }
            if(order === 3) { baseOffsetX = 8; baseOffsetY = 8; }
            
            data.p.element.style.left = `calc(${tile.x}% + ${baseOffsetX}px)`;
            data.p.element.style.top = `calc(${tile.y}% + ${baseOffsetY}px)`;
        });
    });
}

function updateUI(){
    const boxes = [
        document.getElementById("p1box"), 
        document.getElementById("p2box"), 
        document.getElementById("p3box"), 
        document.getElementById("p4box")
    ];
    
    boxes.forEach(b => { 
        if(b) b.innerHTML = "<span style='color:#aaa; font-style:italic;'>Offline</span>"; 
    });

    players.forEach((player, index) => {
        let propsHTML = player.properties.length > 0 ? 
            `<ol class='property-list'>` + player.properties.map(p=>`<li>${p}</li>`).join("") + `</ol>` : 
            "<br><span style='font-size:12px; color:#aaa; padding-left:10px;'>Belum ada aset</span>";
            
        let statusJail = player.jailTurns > 0 ? ` <span style="color:red;">(🔒 Jailed)</span>` : "";
        
        boxes[index].innerHTML = `
            <h3 style="color:${colors[index]};">${player.name}${statusJail}</h3>
            💰 Uang: <b style="color:#1dd1a1;">${player.money}</b><br>
            🏠 Total Aset: <b>${player.properties.length}</b>
            ${propsHTML}
        `;
    });

    poolDisplay.innerHTML = "Crypto Faucet Pool: 💰" + freeParkingPool;
    
    if (turnQueue.length > 0 && gameStarted) {
        turnInfo.innerHTML = "🎯 Giliran " + players[turnQueue[0]].name;
        queueDisplay.innerHTML = turnQueue.map(i => `<span style="color:${colors[i]}">[${players[i].name}]</span>`).join(" ➜ ");
    }
}

function nextTurn(){ 
    if(!checkWinner()){ 
        turnQueue.push(turnQueue.shift()); 
        isMoving = false; 
        btnRoll.disabled = false; 
        updateUI(); 
    } 
}

function checkWinner(){
    for (let p of players) {
        if(p.money >= targetMoney){ 
            alert(`🏆 FINISH! ${p.name} MENANG PERMAINAN dengan total modal 💰${p.money}!`); 
            gameStarted = false; 
            return true; 
        }
        if(p.money <= 0){ 
            alert(`💀 GAME OVER! ${p.name} dinyatakan BANGKRUT total.`); 
            gameStarted = false; 
            return true; 
        }
    }
    return false;
}

function addLog(text){ 
    logBox.innerHTML += text + "<br>"; 
    logBox.scrollTop = logBox.scrollHeight; 
}
</script>
